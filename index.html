<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6750a4">
  <meta name="description" content="HabitFlow — a local-first habit tracker">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>HabitFlow</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="greeting">YOUR DAILY FLOW</p>
        <h1>HabitFlow <span class="spark">✦</span></h1>
        <p class="date" id="today-date"></p>
      </div>
      <button class="icon-button" id="theme-toggle" aria-label="Toggle theme">◐</button>
    </header>

    <main>
      <section class="progress-card" aria-label="Daily progress">
        <div class="progress-copy">
          <p class="eyebrow">TODAY'S PROGRESS</p>
          <h2><span id="completed-count">0</span><span class="muted"> / </span><span id="total-count">0</span></h2>
          <p class="subtext" id="progress-message">A small step is still a step.</p>
        </div>
        <div class="ring" id="progress-ring" role="img" aria-label="0 percent completed">
          <div class="ring-inner"><strong id="progress-percent">0%</strong><span>complete</span></div>
        </div>
      </section>

      <section class="section-heading">
        <div><p class="eyebrow">YOUR ROUTINE</p><h2>Today's habits</h2></div>
        <button class="primary-button" id="add-habit">＋ Add habit</button>
      </section>

      <section id="habit-list" class="habit-list" aria-live="polite"></section>

      <section class="weekly-card">
        <div class="section-heading compact">
          <div><p class="eyebrow">YOUR WEEK</p><h2>Consistency</h2></div>
          <span class="week-badge" id="weekly-percent">0%</span>
        </div>
        <div class="week-bars" id="week-bars"></div>
        <p class="subtext">Your weekly view is based on the habits scheduled each day.</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-tab="Home"><span>⌂</span>Home</button>
      <button class="nav-item" data-tab="Habits"><span>☷</span>Habits</button>
      <button class="nav-item" data-tab="Insights"><span>◌</span>Insights</button>
      <button class="nav-item" data-tab="Calendar"><span>▦</span>Calendar</button>
      <button class="nav-item" data-tab="Settings"><span>⚙</span>Settings</button>
    </nav>
  </div>

  <dialog id="habit-dialog">
    <form id="habit-form" method="dialog">
      <div class="dialog-head"><div><p class="eyebrow">MAKE IT A HABIT</p><h2 id="dialog-title">New habit</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Close">×</button></div>
      <label>Habit name<input id="habit-name" required maxlength="70" placeholder="e.g. Read Qur'an"></label>
      <label>Tracking type
        <select id="habit-type"><option value="boolean">Done / Not done</option><option value="quantity">Quantity target</option><option value="duration">Duration (minutes)</option></select>
      </label>
      <label id="target-label" hidden>Daily target<input id="habit-target" type="number" min="1" step="1" value="5"></label>
      <label>Category<input id="habit-category" maxlength="30" placeholder="e.g. Personal growth"></label>
      <label>Importance <span class="muted">(weight 1–5)</span><input id="habit-weight" type="number" min="1" max="5" value="3"></label>
      <div class="dialog-actions"><button type="button" class="secondary-button" id="cancel-dialog">Cancel</button><button type="submit" class="primary-button">Save habit</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
