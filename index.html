<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#424242"><link rel="manifest" href="manifest.json"><title>Habits</title><link rel="stylesheet" href="style.css"></head><body>
<header id="mainbar"><div class="toolbar"><span class="title">Habits</span><button id="add" aria-label="Add habit">＋</button><button id="filter" aria-label="Filter">☰</button><button id="menu" aria-label="More">⋮</button></div></header>
<header id="detailbar" hidden><div class="toolbar"><button id="back">‹</button><span id="detailIcon">🔴</span><span id="detailTitle" class="title">Habit</span><button id="edit">✎</button><button id="detailMenu">⋮</button></div></header>
<main id="mainview"><div class="dayhead" id="dayhead"></div><div id="habits"></div><div id="empty" class="empty">No habits yet.<br>Tap ＋ to add a habit.</div></main>
<main id="detailview" hidden><section class="intro"><div id="detailDesc"></div><div class="metadata"><span id="detailSchedule">▦ Every day</span><span id="detailReminder"></span></div><div id="detailTarget" class="target"></div></section><section class="section overview"><h2>Overview</h2><div class="overviewgrid"><div class="ring"><span id="overallScore">0%</span></div><div><b id="scoreTotal">0%</b><small>Score</small></div><div><b id="scoreMonth">0%</b><small>Month</small></div><div><b id="scoreYear">0%</b><small>Year</small></div><div><b id="totalCount">0</b><small>Total</small></div></div></section><section class="section"><div class="sectionhead"><h2>Score</h2><select id="scoreRange"><option>Week</option><option>Month</option><option>Year</option></select></div><canvas id="scoreChart" height="230"></canvas></section><section class="section"><div class="sectionhead"><h2>History</h2><select id="historyRange"><option>Week</option><option>Month</option><option>Year</option></select></div><canvas id="historyChart" height="220"></canvas></section><section class="section"><h2>Calendar</h2><div id="calendar"></div><button id="calendarEdit" class="wideEdit">EDIT</button></section><section class="section"><h2>Best streaks</h2><div id="streaks"></div></section><section class="section"><h2>Frequency</h2><div id="frequency"></div></section></main>
<dialog id="habitDialog"><form id="habitForm"><div class="dialoghead"><h2 id="formtitle">New habit</h2><button type="button" id="close" class="plain">✕</button></div><label>Habit name<input id="name" required maxlength="70"></label><label>Description<input id="description" maxlength="120" placeholder="Optional description"></label><label>Icon / emoji<input id="icon" maxlength="4" value="🔴"></label><label>Color<input id="color" type="color" value="#ff9800"></label><label>Frequency<select id="schedule"><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekends">Weekends</option><option value="weekly3">3 times per week</option><option value="custom">Custom weekdays</option></select></label><div id="days" class="days"><label><input type="checkbox" value="1">Mon</label><label><input type="checkbox" value="2">Tue</label><label><input type="checkbox" value="3">Wed</label><label><input type="checkbox" value="4">Thu</label><label><input type="checkbox" value="5">Fri</label><label><input type="checkbox" value="6">Sat</label><label><input type="checkbox" value="0">Sun</label></div><label>Reminder <input id="reminder" type="time"></label><label>Target / unit<input id="target" placeholder="e.g. 30 minutes"></label><div class="formactions"><button type="button" id="delete" class="delete">Delete</button><span></span><button type="button" id="cancel" class="plain">Cancel</button><button class="save">Save</button></div></form></dialog>
<dialog id="menudialog"><div class="dialoghead"><h2>Menu</h2><button id="menuclose" class="plain">✕</button></div><button class="menuitem" id="export">Export backup</button><label class="menuitem">Import backup<input type="file" id="import" accept="application/json"></label><button class="menuitem" id="csv">Export CSV</button><button class="menuitem" id="sort">Sort habits</button></dialog><script src="app.js"></script></body></html>
